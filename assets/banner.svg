<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="JARVIS local voice assistant banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B12"/><stop offset="1" stop-color="#0F1B2B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <rect width="960" height="300" rx="24" fill="url(#bg)"/>
  <!-- waveform -->
  <g transform="translate(60,150)" fill="url(#accent)">
    <rect x="0" y="-12" width="10" height="24" rx="5"/>
    <rect x="22" y="-30" width="10" height="60" rx="5"/>
    <rect x="44" y="-52" width="10" height="104" rx="5"/>
    <rect x="66" y="-70" width="10" height="140" rx="5"/>
    <rect x="88" y="-44" width="10" height="88" rx="5"/>
    <rect x="110" y="-60" width="10" height="120" rx="5"/>
    <rect x="132" y="-26" width="10" height="52" rx="5"/>
    <rect x="154" y="-40" width="10" height="80" rx="5"/>
    <rect x="176" y="-18" width="10" height="36" rx="5"/>
    <rect x="198" y="-8" width="10" height="16" rx="5"/>
  </g>
  <text x="330" y="140" fill="#FFFFFF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="4">JARVIS</text>
  <text x="332" y="190" fill="url(#accent)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600">Local. Private. Controls your PC.</text>
  <text x="332" y="232" fill="#9FB0C3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" textLength="580" lengthAdjust="spacingAndGlyphs">Voice assistant with barge-in, running entirely on your own machine</text>
</svg>
